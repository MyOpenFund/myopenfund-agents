name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q

  local-llm:
    timeout-minutes: 45
    needs: test
    runs-on: ubuntu-latest
    env:
      MOF_AGENTS_TEST_MODEL: qwen3:4b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Resolve the models directory
        run: echo "OLLAMA_MODELS=$HOME/.ollama-models" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ~/.ollama-models
          key: ollama-${{ env.MOF_AGENTS_TEST_MODEL }}
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama || true
      - name: Start Ollama
        run: |
          mkdir -p "$OLLAMA_MODELS"
          ollama serve > ollama.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:11434/api/tags > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "Ollama did not start within 60 s" >&2
          cat ollama.log >&2
          exit 1
      - run: ollama pull "$MOF_AGENTS_TEST_MODEL"
      - run: pytest -q -m local_llm
